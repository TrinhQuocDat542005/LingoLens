version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lingolens-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lingolens
      POSTGRES_USER: lingolens
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lingolens_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
