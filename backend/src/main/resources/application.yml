server:
  port: 8080

spring:
  datasource:
    # Docker exposes LingoLens PostgreSQL on 5433 to avoid local PostgreSQL conflicts.
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/lingolens}
    username: lingolens
    password: ${DB_PASSWORD:lingolens_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

# Custom Security & JWT properties
security:
  jwt:
    # Override JWT_SECRET in every deployed environment.
    secret-key: ${JWT_SECRET:dev-only-lingolens-secret-key-change-before-production-2026}
    # 15 minutes (in milliseconds)
    expiration-time: 900000
    # 7 days (in milliseconds)
    refresh-expiration-time: 604800000

app:
  admin:
    bootstrap:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
